name: RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Подключение по SSH для отладки
      uses: mxschmitt/action-tmate@v3
    - name: Мгновенный вход в машину
      run: |
       sudo apt-get update && sudo apt-get install -y tmate
       tmate -F
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user rdpuser "MySuperPassword123!" /add
        net localgroup Administrators rdpuser /add
        Start-Job -ScriptBlock { ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net }
        Start-Sleep -Seconds 60
