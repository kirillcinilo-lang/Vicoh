name: Windows-RDP-Serveo

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Create Password for Administrator
      run: |
        $Password = ConvertTo-SecureString "MySuperPassword123!" -AsPlainText -Force
        Set-LocalUser -Name "Administrator" -Password $Password

    - name: Connect to Serveo Tunnel and Hold
      run: |
        Write-Host "Запуск RDP туннеля через Serveo..."
        # Запускаем SSH-туннель с автоматическим подтверждением ключей и пробросом правильного TCP порта
        Start-Job -ScriptBlock {
            ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net
        }
        
        # Ожидаем 15 секунд для генерации ссылки в логах
        Start-Sleep -Seconds 15
        
        # Удерживаем виртуальную машину активной в течение 6 часов
        Start-Sleep -Seconds 21600
