name: Windows-RDP-Serveo

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Create Password for Administrator
      run: |
        $Password = ConvertTo-SecureString "MySuperPassword123!" -AsPlainText -Force
        Set-LocalUser -Name "Administrator" -Password $Password

    - name: Connect to Serveo Tunnel
      run: |
        Write-Host "Подключение к туннелю... Подождите 10 секунд."
        start-process ssh -ArgumentList "-R 80:localhost:3389 serveo.net"
        Start-Sleep -Seconds 10
        
