name: Create RDP VM

on:
  workflow_dispatch:

jobs:
  create-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install doctl and jq
        run: |
          curl -L https://github.com/digitalocean/doctl/releases/download/v1.98.0/doctl_1.98.0_linux_amd64.tar.gz | tar xz
          sudo mv doctl /usr/local/bin/
          sudo apt update
          sudo apt install -y jq

      - name: Create Droplet
        env:
          DO_TOKEN: ${{ secrets.CLOUD_PROVIDER_API_KEY }}
        run: |
          doctl auth init --access-token "$DO_TOKEN"
          droplet_id=$(doctl compute droplet create rdp-vm \
            --region ${{ secrets.REGION }} \
            --size s-1vcpu-1gb \
            --image ubuntu-22-04-x64 \
            --ssh-keys "${{ secrets.SSH_PUB_KEY }}" \
            --wait | jq -r '.[] | .id')
          echo "DROPPLET_ID=$droplet_id" >> $GITHUB_ENV

          # Более надёжный способ получить публичный IP
          droplet_ip=$(doctl compute droplet get "$droplet_id" --output json | jq -r '.[] | .networks.v4[] | select(.type=="public") | .ip_address' | head -n1)
          echo "DROPPLET_IP=$droplet_ip" >> $GITHUB_ENV
          echo "VM IP: $droplet_ip"

      - name: Wait for SSH
        run: |
          IP="${{ env.DROPPLET_IP }}"
          if [ -z "$IP" ]; then
            echo "ERROR: IP is empty — check the previous step log"
            exit 1
          fi
          until ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no root@"$IP" uptime; do
            echo "Waiting for SSH..."
            sleep 10
          done

      - name: Setup RDP (xrdp + XFCE)
        run: |
          IP="${{ env.DROPPLET_IP }}"
          ssh -o StrictHostKeyChecking=no root@"$IP" bash -s << 'EOF'
          apt update
          DEBIAN_FRONTEND=noninteractive apt install -y xrdp xfce4 xfce4-goodies
          sed -i 's/param=Xorg/param=none/' /etc/xrdp/startwm.sh
          cat > ~/.xsession << 'SESSION'
          startxfce4
          SESSION
          systemctl enable xrdp
          systemctl restart xrdp
          EOF

      - name: Show VM info
        run: |
          echo "✅ VM created successfully!"
          echo "IP: ${{ env.DROPPLET_IP }}"
          echo "RDP Port: 3389"
          echo "Username: ubuntu"
          echo ""
          echo "Чтобы подключиться, запусти на своей машине:"
          echo "  ngrok tcp 3389"
          echo "И используй выданный адрес в RDP-клиенте."
